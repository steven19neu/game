<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<title>Rooftop Leap – 79° Physics</title>
<style>
  :root{
    --paper:#0b1220;
    --ink:#e7edf5;
    --good:#35c98c;
    --bad:#ff6767;
    --accent:#3fa9f5;
    --panel:#111c2c;
    --muted:rgba(231,237,245,.6);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--paper);overscroll-behavior:none}
  body{
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    color:var(--ink);
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
    -webkit-tap-highlight-color:transparent;touch-action:none;
  }
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}

  .hud{position:fixed;left:0;right:0;top:0;pointer-events:none;padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 0}
  .row{display:flex;justify-content:space-between;align-items:flex-end}
  .dist{font-size:40px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
  .dist small{font-size:16px;font-weight:600;margin-left:3px;color:var(--muted)}
  .best{font-size:13px;color:var(--muted);text-align:right;line-height:1.35;font-variant-numeric:tabular-nums}
  .best b{color:var(--ink);font-size:15px}

  .charge{margin-top:10px}
  .track{position:relative;height:14px;border:2px solid var(--ink);border-radius:8px;background:rgba(255,255,255,.08);overflow:hidden}
  .fill{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--accent)}
  .tick{position:absolute;top:0;bottom:0;width:2px;background:var(--ink);opacity:.55}
  .readout{margin-top:6px;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;min-height:18px}
  .readout b{color:var(--ink)}
  .readout .ok{color:var(--good);font-weight:700}
  .readout .no{color:var(--bad);font-weight:700}

  .ov{position:fixed;left:0;right:0;top:27%;display:flex;justify-content:center;padding:0 20px;pointer-events:none}
  .ov[hidden]{display:none}
  .card{
    width:100%;max-width:340px;background:var(--panel);border:2px solid var(--ink);
    border-radius:14px;padding:18px 18px 16px;box-shadow:5px 5px 0 var(--accent);
  }
  .card h1{margin:0 0 8px;font-size:22px;letter-spacing:-.01em}
  .card p{margin:0 0 10px;font-size:14.5px;line-height:1.5}
  .card ul{margin:0 0 10px;padding-left:18px;font-size:13.5px;line-height:1.5}
  .card .legend{display:flex;gap:14px;font-size:13px;margin-bottom:6px}
  .card .legend i{display:inline-block;width:18px;height:0;border-top:4px dotted;vertical-align:middle;margin-right:6px}
  #demo{display:block;width:100%;height:auto;aspect-ratio:300/120;border-radius:8px;background:rgba(255,255,255,.04)}
  .demoCaption{display:flex;justify-content:center;gap:8px;margin-top:6px;font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.01em}
  .demoCaption span{color:var(--ink)}
  .card button{
    pointer-events:auto;margin-top:12px;width:100%;font:inherit;font-weight:700;font-size:16px;
    padding:13px;border:2px solid var(--ink);border-radius:10px;background:var(--accent);color:var(--paper);cursor:pointer;
  }
  .card button:active{transform:translate(2px,2px)}
  .card button:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
  .card .stats{font-size:14px;line-height:1.6;font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div class="hud">
  <div class="row">
    <div class="dist"><span id="dist">0.0</span><small>m</small></div>
    <div class="best">Best<br><b><span id="best">0.0</span> m</b></div>
  </div>
  <div class="charge">
    <div class="track">
      <div class="fill" id="fill"></div>
      <div class="tick" style="left:5%"></div>
    </div>
    <div class="readout" id="readout"></div>
  </div>
</div>

<div class="ov" id="ov">
  <div class="card">
    <h1 id="ovTitle">Rooftop Leap</h1>
    <p id="ovMsg">Drag to charge, release to jump. Roof to roof — don't hit a wall or fall.</p>
    <div id="ovBody">
      <canvas id="demo" width="300" height="120"></canvas>
      <div class="demoCaption"><span>Hold</span>→<span>Release</span>→<span>Land</span></div>
    </div>
    <button id="again" hidden>Play again</button>

  </div>
</div>

<script>
(() => {
  "use strict";

  /* ---------- Hằng số vật lý ---------- */
  const G = 9.8;                           // m/s²
  const ANG = 79 * Math.PI / 180;          // góc bật cố định
  const HMAX = 20;                         // độ cao tối đa khi giữ 2,0 s (m) — gấp đôi mức cũ (10 m)
  const T_MIN = 0.1, T_MAX = 2.0;          // thời gian giữ (s)
  const VY_MAX = Math.sqrt(2 * G * HMAX);  // h = (v·sinθ)²/2g = 20  ->  v·sinθ ≈ 19,8 m/s
  const V_MAX = VY_MAX / Math.sin(ANG);    // tốc độ bật tối đa suy ngược ≈ 19,99 m/s
  const VX_MAX = V_MAX * Math.cos(ANG);
  const V_MIN_FRAC = 0.2;                  // giữ 0,1 s -> 20% tốc độ tối đa, tuyến tính tới 100% ở 2,0 s

  function speedFor(t){
    t = Math.min(T_MAX, Math.max(T_MIN, t));
    const f = (t - T_MIN) / (T_MAX - T_MIN);
    return V_MAX * (V_MIN_FRAC + (1 - V_MIN_FRAC) * f);
  }
  const heightOf = v => Math.pow(v * Math.sin(ANG), 2) / (2 * G);
  const rangeOf  = v => 2 * v * Math.sin(ANG) * v * Math.cos(ANG) / G;

  /* ---------- Hằng số thế giới ---------- */
  const HW = 0.25;        // nửa bề rộng hộp va chạm của nhân vật (m)
  const LAND_M = 0.15;    // dung sai: tâm nhân vật lệch mép nóc nhà tối đa còn tính là đáp được
  const FLOOR = -2;       // đáy vực: rơi qua mức này là thua
  const H_MIN = 3, H_MAX = 20;
  const BOUNCE_DAMP = 0.45;   // hệ số hoàn lại vận tốc ngang sau mỗi lần bật tường (mất năng lượng)
  const MAX_BOUNCES = 8;      // giới hạn an toàn, tránh dội qua lại vô hạn giữa hai bức tường sát nhau

  /* ---------- Tiện ích ---------- */
  const $ = id => document.getElementById(id);
  const fmt = (n, d = 1) => n.toFixed(d);
  const rand = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));

  const canvas = $('c'), ctx = canvas.getContext('2d');
  const demoCanvas = $('demo'), dctx = demoCanvas ? demoCanvas.getContext('2d') : null;
  const elDist = $('dist'), elBest = $('best'), elFill = $('fill'), elRead = $('readout');
  const ov = $('ov'), ovTitle = $('ovTitle'), ovMsg = $('ovMsg'), ovBody = $('ovBody'), btnAgain = $('again');

  let best = 0;
  try { best = parseFloat(localStorage.getItem('rooftopleap_best')) || 0; } catch (e) {}
  elBest.textContent = fmt(best);

  /* ---------- Trạng thái ---------- */
  let W = 0, H = 0, dpr = 1, S = 40, anchorY = 0, viewW = 10;
  let state = 'ready';            // ready | playing | dead
  let deadReason = '';
  let P;                          // {x, y, vx, vy}  (y = độ cao chân)
  let grounded, charging, hold, pending, maxX, camX, camY, landT, wallT, deadT, lastRoof;
  let hitWall = false, bounceCount = 0;
  let demoT = 0;
  let curB = null;               // toà nhà nhân vật đang đứng/đi bộ trên đó
  const WALK_SPEED = 3.0;        // m/s — tốc độ đi bộ trên mái nhà
  let walkedOff = false;         // rơi do đi bộ hết mép (để phân biệt lý do thua với nhảy hụt)
  let hitUFO = false;            // rơi do đâm đầu vào đĩa bay
  let activeId = null, keyMode = false, dragX0 = 0, dragY0 = 0, dragX = 0;
  let buildings, bid, particles, ufos, uid = 0, lastTime = 0, acc = 0;

  const COL = {
    paper:'#0b1220', ink:'#e7edf5', good:'#35c98c', bad:'#ff6767', accent:'#3fa9f5', void:'#04070c', hint:'#3fa9f5'
  };
  const BODY = ['#1b2431', '#1c2a3f', '#212a3a', '#1a2f38', '#242034'];
  const CAP  = ['#3d5468', '#3d5a82', '#454f6e', '#3a5f66', '#4a4460'];

  function resize(){
    dpr = Math.min(window.devicePixelRatio || 1, 3);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
    anchorY = H * 0.68;
    S = Math.min(W / 9.5, anchorY / 12.5);
    viewW = W / S;
  }

  /* ---------- Sinh địa hình: các toà nhà cao thấp ngẫu nhiên ---------- */
  // tầm xa ngang tối đa (giữ 2,0 s) để đáp lên sàn cao hơn/thấp hơn dh so với sàn bật
  function reachRange(dh){
    const d = VY_MAX * VY_MAX - 2 * G * dh;
    return d <= 0 ? 0 : VX_MAX * (VY_MAX + Math.sqrt(d)) / G;
  }
  function genAhead(x){
    let last = buildings[buildings.length - 1];
    while (last.x1 < x + 45){
      const d = last.x1;
      let h = last.h + rand(-6, 4.5);
      if (h < H_MIN || h > H_MAX) h = last.h + (h < H_MIN ? 1 : -1) * rand(1, 5);
      h = clamp(h, H_MIN, H_MAX);
      let dh = h - last.h;

      let gap = Math.random() < 0.28 ? 0 : rand(0.6, Math.min(4.6, 1.8 + d / 40));
      // hai toà san sát nhau thì phải chênh độ cao rõ rệt để thành "bức tường"
      if (gap === 0 && Math.abs(dh) < 1){
        h = clamp(last.h + (Math.random() < 0.5 ? 1 : -1) * rand(1, 3), H_MIN, H_MAX);
        if (Math.abs(h - last.h) < 0.8) h = clamp(last.h + 2, H_MIN, H_MAX) === last.h ? last.h - 2 : clamp(last.h + 2, H_MIN, H_MAX);
        dh = h - last.h;
      }
      gap = Math.min(gap, 0.85 * reachRange(dh));
      if (gap < 0.5) gap = 0;

      const lo = Math.max(1.4, 3.2 - d / 80), hi = Math.max(lo + 0.6, 4.8 - d / 50);
      const w = rand(lo, hi);
      const prevH = last.h;
      last = { x0: d + gap, x1: d + gap + w, h, id: bid++ };
      buildings.push(last);

      // đĩa bay ngẫu nhiên trong bầu trời phía trên, tỉ lệ xuất hiện thấp (~14%)
      if (Math.random() < 0.14){
        ufos.push({
          x: d + rand(-1.5, gap + w * 0.7),
          y: Math.max(prevH, h) + rand(3, 10),
          r: rand(0.75, 1.05),
          alive: true, vx: 0, vy: 0, rot: 0, rotSpeed: 0, phase: rand(0, Math.PI * 2),
          id: uid++
        });
      }
    }
  }

  function reset(){
    bid = 0; uid = 0;
    buildings = [{ x0: -12, x1: 5, h: 6, id: bid++ }];
    ufos = [];
    genAhead(0);
    P = { x: 0, y: 6, vx: 0, vy: 0 };
    lastRoof = 6; curB = buildings[0];
    grounded = true; charging = false; hold = 0; pending = null; maxX = 0; landT = 0; wallT = 0; deadT = 0;
    hitWall = false; bounceCount = 0;
    demoT = 0; walkedOff = false; hitUFO = false;
    activeId = null; keyMode = false;
    particles = [];
    camX = P.x - viewW * 0.28; camY = P.y;
    state = 'ready'; deadReason = '';
    ov.hidden = false; btnAgain.hidden = true;
    ovTitle.textContent = 'Rooftop Leap';
    ovMsg.textContent = 'Touch and drag right to charge power (drag left to reduce), release to jump.';
    ovBody.hidden = false;
  }

  /* ---------- Vật lý bay + va chạm (dùng chung cho game và đường dự đoán) ---------- */
  function advance(o, dt){
    const x0 = o.x, y0 = o.y;
    o.x += o.vx * dt;                              // vx không đổi
    o.y += o.vy * dt - 0.5 * G * dt * dt;          // vy giảm dần theo g
    o.vy -= G * dt;

    // 1) đáp xuống nóc nhà (cắt qua mặt phẳng nóc khi đang đi xuống)
    for (const b of buildings){
      if (y0 >= b.h - 1e-9 && o.y < b.h){
        const k = (y0 - b.h) / (y0 - o.y);
        const xc = x0 + (o.x - x0) * k;
        if (xc >= b.x0 - LAND_M && xc <= b.x1 + LAND_M){
          o.x = xc; o.y = b.h;
          return { type: 'land', b };
        }
      }
    }
    // 2) đâm vào tường nhà -> bật ra: đảo và giảm vx (mất năng lượng), đẩy ra khỏi thân nhà,
    //    nếu đang rơi thì bật lên nhẹ; vy vẫn tiếp tục chịu g như bình thường sau đó.
    for (const b of buildings){
      if (o.x + HW > b.x0 && o.x - HW < b.x1 && o.y < b.h - 0.06){
        const cameFromLeft = x0 + HW <= b.x0 + 1e-6;
        const cameFromRight = x0 - HW >= b.x1 - 1e-6;
        const toLeft = cameFromRight ? false : cameFromLeft ? true : (o.x - b.x0) < (b.x1 - o.x);
        if (toLeft){ o.x = b.x0 - HW - 0.02; o.vx = -Math.abs(o.vx) * BOUNCE_DAMP; }
        else       { o.x = b.x1 + HW + 0.02; o.vx =  Math.abs(o.vx) * BOUNCE_DAMP; }
        // Tường thẳng đứng chỉ tác động lên thành phần vận tốc ngang (pháp tuyến của tường).
        // Thành phần thẳng đứng (vy) giữ nguyên, nên nếu đang rơi chéo thì sau va chạm vẫn
        // tiếp tục rơi chéo (đổi hướng ngang) chứ không bị hất bật lên.
        return { type: 'bounce' };
      }
    }
    // 3) rơi xuống vực
    if (o.y < FLOOR) return { type: 'abyss' };
    return null;
  }

  function simulate(o){
    const pts = [[o.x, o.y]];
    let res = null;
    for (let i = 0; i < 420 && !res; i++){
      res = advance(o, 1 / 60);
      if (i % 2 === 0 || res) pts.push([o.x, o.y]);
    }
    return { pts, res };
  }

  /* ---------- Điều khiển ---------- */
  function launch(h){
    const v = speedFor(h);
    P.vx = v * Math.cos(ANG);
    P.vy = v * Math.sin(ANG);
    grounded = false; walkedOff = false;
  }
  // Tích lực bằng thao tác kéo ngang: chạm điểm đầu, kéo sang phải để tăng, kéo về trái để giảm.
  // Có thể tích cả khi đang bay: lực tích trên không được dùng ngay khi chạm nóc nhà.
  const dragFull = () => Math.min(W * 0.18, 84);       // độ dài kéo (px) ứng với lực tối đa — 30% mức cũ (0,6·W, tối đa 280)
  function setHoldFromDrag(x){
    dragX = x;
    const L = clamp((x - dragX0) / dragFull(), 0, 1);
    hold = T_MIN + L * (T_MAX - T_MIN);
  }
  function press(){
    if (state === 'dead' || charging) return false;
    if (state === 'ready'){ state = 'playing'; ov.hidden = true; }
    charging = true; hold = T_MIN; pending = null;
    // Nhân vật vẫn tiếp tục đi bộ bình thường trong lúc tích lực, không đứng khựng lại.
    return true;
  }
  function release(){
    if (!charging) return;
    charging = false; keyMode = false;
    if (grounded){ launch(hold); }
    else { pending = hold; }   // đã chốt lực, chờ chạm nóc
    hold = 0;
  }
  canvas.addEventListener('pointerdown', e => {
    e.preventDefault();
    if (activeId !== null) return;
    activeId = e.pointerId;
    dragX0 = dragX = e.clientX; dragY0 = e.clientY;
    press();
  });
  window.addEventListener('pointermove', e => {
    if (e.pointerId !== activeId || !charging || keyMode) return;
    e.preventDefault();
    setHoldFromDrag(e.clientX);
  }, { passive: false });
  const endPointer = e => {
    if (e.pointerId !== activeId) return;
    activeId = null;
    release();
  };
  window.addEventListener('pointerup', endPointer);
  window.addEventListener('pointercancel', endPointer);
  window.addEventListener('blur', () => { activeId = null; release(); });
  window.addEventListener('contextmenu', e => e.preventDefault());
  // Bàn phím (dự phòng trên máy tính): giữ Space để lực tăng dần theo thời gian
  window.addEventListener('keydown', e => {
    if (e.code === 'Space'){
      e.preventDefault();
      if (state === 'dead' && deadT > 0.5){ reset(); return; }
      if (!e.repeat && activeId === null && press()) keyMode = true;
    }
  });
  window.addEventListener('keyup', e => { if (e.code === 'Space' && keyMode) release(); });
  btnAgain.addEventListener('click', reset);
  window.addEventListener('resize', resize);

  /* ---------- Cập nhật ---------- */
  function die(reason){
    state = 'dead'; deadReason = reason; deadT = 0; charging = false; pending = null;
    const dist = Math.max(0, maxX);
    if (dist > best){
      best = dist;
      try { localStorage.setItem('rooftopleap_best', String(best)); } catch (e) {}
    }
    elBest.textContent = fmt(best);
  }
  const REASONS = {
    wall:     ['Hit a wall', 'You clipped the wall of a taller building, bounced off, and fell into the gap.'],
    abyss:    ['Fell into the gap', 'The jump wasn\'t far enough to reach the next roof.'],
    walkoff:  ['Walked off the edge', 'You didn\'t jump before reaching the end of the roof.']
  };
  function showDead(){
    const dist = Math.max(0, maxX);
    const r = REASONS[deadReason] || REASONS.abyss;
    ov.hidden = false;
    ovTitle.textContent = r[0];
    ovMsg.innerHTML = '<div style="margin-bottom:8px">' + r[1] + '</div><div class="stats">Distance: <b>' +
      fmt(dist) + ' m</b><br>Best: <b>' + fmt(best) + ' m</b></div>';
    ovBody.hidden = true;
    btnAgain.hidden = false;
  }

  function onLand(b){
    grounded = true; P.vx = 0; P.vy = 0; lastRoof = b.h; landT = 0.14; curB = b; walkedOff = false;
    hitWall = false; bounceCount = 0;   // đáp an toàn lên nóc nhà thì thoát khỏi chuỗi bật tường
    for (let i = 0; i < 9; i++){
      particles.push({ x: P.x, y: b.h + 0.05, fl: b.h, vx: rand(-1.6, 1.6), vy: rand(0.6, 2.2), life: rand(0.25, 0.5) });
    }
    genAhead(P.x);
    if (charging){                       // đang giữ: nhảy ngay theo lực đã tích, ngừng tích thêm
      const h = hold; charging = false; hold = 0; pending = null; launch(h);
    } else if (pending !== null){        // đã chốt lực trước đó
      const h = pending; pending = null; launch(h);
    } else {
      P.vx = WALK_SPEED;                 // chưa tích lực: tự đi bộ chậm về phía trước trên mái nhà
    }
  }

  function spawnWallHit(x, y, dir){
    for (let i = 0; i < 7; i++){
      particles.push({ x, y, fl: -1e9, wall: true, vx: dir * rand(0.6, 2.4), vy: rand(-0.4, 2.2), life: rand(0.2, 0.4) });
    }
  }

  function step(dt){
    if (charging && keyMode) hold = Math.min(T_MAX, hold + dt);
    if (landT > 0) landT = Math.max(0, landT - dt);
    if (wallT > 0) wallT = Math.max(0, wallT - dt);

    if (state !== 'dead' && !grounded){
      const res = advance(P, dt);
      if (P.x > maxX) maxX = P.x;
      if (res){
        if (res.type === 'land') onLand(res.b);
        else if (res.type === 'bounce'){
          hitWall = true; wallT = 0.12;
          spawnWallHit(P.x, P.y, Math.sign(P.vx) || 1);
          if (++bounceCount > MAX_BOUNCES) die('wall');   // an toàn: chặn dội vô hạn giữa hai tường sát nhau
        } else die(hitWall ? 'wall' : (walkedOff ? 'walkoff' : res.type));
      }
    } else if (state === 'playing' && grounded && P.vx > 0){
      // đang đi bộ chậm trên mái nhà: nếu đi hết mép mà chưa nhảy thì rơi khỏi mép một cách tự nhiên
      P.x += P.vx * dt;
      if (P.x > maxX) maxX = P.x;
      if (curB && P.x - HW > curB.x1){
        grounded = false; walkedOff = true;   // rơi khỏi mép: vx giữ nguyên đà đi bộ, vy bắt đầu từ 0 rồi rơi theo g
      }
    }
    for (let i = particles.length - 1; i >= 0; i--){
      const p = particles[i];
      p.life -= dt; p.vy -= G * dt * 0.5; p.x += p.vx * dt; p.y = Math.max(p.fl, p.y + p.vy * dt);
      if (p.life <= 0) particles.splice(i, 1);
    }
  }

  /* ---------- Vẽ ---------- */
  const sx = x => (x - camX) * S;
  const sy = y => anchorY - (y - camY) * S;

  function drawGrid(){
    const x0 = Math.floor(camX) - 1, x1 = Math.ceil(camX + viewW) + 1;
    ctx.lineWidth = 1;
    for (let m = x0; m <= x1; m++){
      ctx.strokeStyle = m % 5 === 0 ? 'rgba(231,237,245,.14)' : 'rgba(231,237,245,.05)';
      const X = Math.round(sx(m)) + .5;
      ctx.beginPath(); ctx.moveTo(X, 0); ctx.lineTo(X, H); ctx.stroke();
    }
    const yTop = camY + anchorY / S, yBot = camY - (H - anchorY) / S;
    for (let m = Math.floor(yBot); m <= Math.ceil(yTop); m++){
      ctx.strokeStyle = m % 5 === 0 ? 'rgba(231,237,245,.14)' : 'rgba(231,237,245,.05)';
      const Y = Math.round(sy(m)) + .5;
      ctx.beginPath(); ctx.moveTo(0, Y); ctx.lineTo(W, Y); ctx.stroke();
    }
    // vạch +10 m so với sàn nhảy hiện tại
    const Y10 = sy(lastRoof + HMAX);
    ctx.save();
    ctx.setLineDash([8, 6]); ctx.strokeStyle = 'rgba(157,124,255,.8)'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(0, Y10); ctx.lineTo(W, Y10); ctx.stroke();
    ctx.restore();
    ctx.font = '600 11px ui-monospace, SFMono-Regular, Menlo, monospace';
    ctx.textAlign = 'left'; ctx.fillStyle = 'rgba(196,178,255,.95)';
    ctx.fillText('+' + HMAX + ' m max height from launch pad', 8, Y10 - 5);
  }

  function hash(a, b, c){
    let h = (a * 73856093) ^ (b * 19349663) ^ (c * 83492791);
    h = (h ^ (h >>> 13)) >>> 0;
    return h % 100;
  }

  function drawBuildings(){
    const yBase = sy(FLOOR);
    for (const b of buildings){
      if (b.x1 < camX - 1 || b.x0 > camX + viewW + 1) continue;
      const X0 = sx(b.x0), Wd = (b.x1 - b.x0) * S, Yt = sy(b.h);
      const ci = b.id % BODY.length;
      ctx.fillStyle = BODY[ci]; ctx.fillRect(X0, Yt, Wd, yBase - Yt);
      // cửa sổ
      const cols = Math.max(1, Math.floor((b.x1 - b.x0 - 0.3) / 1.1));
      const offX = ((b.x1 - b.x0) - cols * 1.1) / 2 + 0.325;
      for (let r = 0; ; r++){
        const wy = b.h - 1.3 - r * 1.5;
        const Y = sy(wy);
        if (Y > H || wy < FLOOR) break;
        if (Y < -40) continue;
        for (let c = 0; c < cols; c++){
          const lit = hash(b.id + 1, c, r) < 45;
          ctx.fillStyle = lit ? 'rgba(150,215,255,.55)' : 'rgba(255,255,255,.05)';
          ctx.fillRect(sx(b.x0 + offX + c * 1.1), Y, 0.45 * S, 0.62 * S);
        }
      }
      // mái (sàn bật nhảy)
      ctx.fillStyle = CAP[ci]; ctx.fillRect(X0, Yt, Wd, Math.max(5, 0.22 * S));
    }
    // đáy vực
    if (yBase < H){
      ctx.fillStyle = COL.void; ctx.fillRect(0, yBase, W, H - yBase);
      ctx.fillStyle = 'rgba(255,103,103,.85)'; ctx.fillRect(0, yBase, W, 3);
    }
  }

  // Chỉ vẽ một đoạn ngắn ở đầu quỹ đạo để gợi ý hướng bay, không lộ trước điểm rơi hay kết quả.
  const HINT_T = 0.42;   // thời gian gợi ý (s)
  function shortArc(o){
    const pts = [[o.x, o.y]];
    const c = { x: o.x, y: o.y, vx: o.vx, vy: o.vy };
    const n = 18;
    for (let i = 1; i <= n; i++){
      const tt = HINT_T * i / n;
      pts.push([o.x + o.vx * tt, o.y + o.vy * tt - 0.5 * G * tt * tt]);
    }
    return pts;
  }
  function drawHint(o, strong){
    const pts = shortArc(o);
    ctx.fillStyle = strong ? COL.hint : 'rgba(231,237,245,.28)';
    for (let i = 0; i < pts.length; i++){
      const p = pts[i];
      const r = strong ? (2.2 + 2.2 * i / pts.length) : 2;
      ctx.beginPath(); ctx.arc(sx(p[0]), sy(p[1]), r, 0, Math.PI * 2); ctx.fill();
    }
  }

  function drawPlayer(){
    const c = charging ? Math.min(1, hold / T_MAX) : 0;
    let ky = 1 - 0.38 * c, kx = 1 + 0.25 * c;
    if (landT > 0){ const l = landT / 0.14; ky = 1 - 0.22 * l; kx = 1 + 0.16 * l; }
    else if (wallT > 0){ const l = wallT / 0.12; kx = 1 - 0.3 * l; ky = 1 + 0.2 * l; }
    else if (!grounded){ const s = Math.min(0.14, Math.abs(P.vy) / 14 * 0.14); ky = 1 + s; kx = 1 - s * 0.6; }
    else if (grounded && P.vx > 0){ const s = Math.sin(P.x * 9) * 0.05; ky *= 1 + s; kx *= 1 - s * 0.5; }   // lắc nhẹ theo nhịp bước, kết hợp cùng độ nén khi đang tích lực
    const bw = 0.62 * kx * S, bh = 0.74 * ky * S;
    const cx = sx(P.x), cy = sy(P.y) - bh / 2;

    ctx.fillStyle = COL.accent; ctx.strokeStyle = COL.ink; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.ellipse(cx, cy, bw / 2, bh / 2, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    // kính che mặt: toạ độ đo trực tiếp từ ảnh mẫu bằng phân vùng màu (OpenCV), không áng chừng bằng mắt
    drawVisor(cx + bw * 0.08, cy - bh * 0.02, bw * 1.05);
  }

  // Không gian thiết kế 425×153, các điểm lấy đúng theo contour thật đo được trên ảnh mẫu người dùng cung cấp
  // (tách nền bằng ngưỡng màu, dò biên, đơn giản hoá đa giác), co giãn đều theo w để giữ nguyên tỉ lệ gốc.
  function drawVisor(vcx, vcy, w){
    const DW = 425, DH = 153, k = w / DW, h = DH * k;
    ctx.save();
    ctx.translate(vcx - w / 2, vcy - h * 0.42);
    ctx.scale(k, k);

    // viền ngoài: mép trên (trái->phải) -> đầu nhọn phải -> mép dưới có khe hình chữ V (phải->trái) -> đầu nhọn trái
    const OUT = [
      [0,0],[30,2],[60,5],[90,8],[120,11],[150,14],[180,16],[210,17],[240,19],
      [270,20],[300,20],[330,21],[360,20],[384,20],[390,11],[415,11],[425,79],
      [411,120],[377,146],[365,143],[345,114],[319,115],[275,153],[178,132],
      [103,95],[80,49],[20,30]
    ];
    ctx.beginPath();
    ctx.moveTo(OUT[0][0], OUT[0][1]);
    for (let i = 1; i < OUT.length; i++) ctx.lineTo(OUT[i][0], OUT[i][1]);
    ctx.closePath();
    ctx.fillStyle = '#182236';
    ctx.fill();
    ctx.strokeStyle = '#04070a'; ctx.lineWidth = 4; ctx.lineJoin = 'round';
    ctx.stroke();

    // mặt vát chéo sáng hơn cắt ngang tròng kính (đúng vị trí quan sát được trong ảnh)
    ctx.beginPath();
    ctx.moveTo(101, 22); ctx.lineTo(146, 14); ctx.lineTo(221, 139); ctx.lineTo(176, 149);
    ctx.closePath();
    ctx.fillStyle = 'rgba(190,205,225,.14)';
    ctx.fill();

    // vệt sáng phát quang: đúng đường tâm đo được của vệt cyan (hơi võng xuống ở giữa rồi nhô lại)
    ctx.shadowColor = COL.accent; ctx.shadowBlur = 9;
    ctx.strokeStyle = COL.accent; ctx.lineWidth = 5; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.beginPath();
    ctx.moveTo(139, 54); ctx.lineTo(201, 60); ctx.lineTo(251, 63.5); ctx.lineTo(307, 65.5);
    ctx.lineTo(351, 64); ctx.lineTo(391, 61.5); ctx.lineTo(420, 57);
    ctx.stroke();
    ctx.shadowBlur = 0;

    ctx.restore();
  }

  function drawParticles(){
    ctx.fillStyle = 'rgba(255,255,255,.7)';
    for (const p of particles){
      ctx.beginPath(); ctx.arc(sx(p.x), sy(p.y), 2.2, 0, Math.PI * 2); ctx.fill();
    }
  }

  function drawDragLine(color){
    const full = dragFull();
    const y = dragY0;
    const x0 = dragX0;
    const L = clamp((dragX - dragX0) / full, 0, 1);
    const x1 = x0 + L * full;
    ctx.save();
    ctx.lineCap = 'round';
    // thang đo lực tối đa
    ctx.setLineDash([2, 9]); ctx.strokeStyle = 'rgba(231,237,245,.35)'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(x0, y); ctx.lineTo(x0 + full, y); ctx.stroke();
    ctx.setLineDash([]);
    // đường tích lực: song song với sàn, từ điểm chạm đầu tới điểm chạm hiện tại
    ctx.strokeStyle = COL.hint; ctx.lineWidth = 6;
    ctx.beginPath(); ctx.moveTo(x0, y); ctx.lineTo(x1, y); ctx.stroke();
    ctx.fillStyle = COL.accent;
    ctx.beginPath(); ctx.arc(x0, y, 7, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.strokeStyle = COL.accent; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(x1, y, 10, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.restore();
  }

  function render(){
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = COL.paper; ctx.fillRect(0, 0, W, H);
    drawGrid();
    drawBuildings();

    // gợi ý bay: chỉ một đoạn ngắn, một màu duy nhất, không lộ kết quả trước
    let pred = null, warn = null;
    if (state !== 'dead'){
      if (grounded){
        if (charging){
          const v = speedFor(hold);
          drawHint({ x: P.x, y: P.y, vx: v * Math.cos(ANG), vy: v * Math.sin(ANG) }, true);
          pred = { v };
        }
      } else {
        const has = charging || pending !== null;
        if (!has){
          warn = 'nocharge';
          drawHint({ x: P.x, y: P.y, vx: P.vx, vy: P.vy }, false);
        } else {
          const v = speedFor(charging ? hold : pending);
          drawHint({ x: P.x, y: P.y, vx: P.vx, vy: P.vy }, false);
          drawHint({ x: P.x, y: P.y, vx: v * Math.cos(ANG), vy: v * Math.sin(ANG) }, true);
          pred = { v };
        }
      }
    }
    drawParticles();
    drawPlayer();
    if (charging && !keyMode) drawDragLine();

    // HUD
    elDist.textContent = fmt(Math.max(0, maxX));
    const shown = charging ? hold : (pending !== null ? pending : 0);
    elFill.style.width = (shown / T_MAX * 100) + '%';
    elFill.style.background = COL.accent;
    if (pred){
      const tt = Math.max(shown, T_MIN);
      elRead.innerHTML = 'Power <b>' + Math.round((tt - T_MIN) / (T_MAX - T_MIN) * 100) + '%</b>';
    } else if (warn === 'nocharge'){
      elRead.innerHTML = '<span class="no">No power — will just walk</span>';
    } else if (state !== 'dead'){
      elRead.textContent = 'Drag to charge power';
    } else {
      elRead.textContent = '';
    }
  }

  /* ---------- Hình minh hoạ cách chơi (vòng lặp riêng, chỉ chạy ở màn hình chờ) ---------- */
  function drawDemo(dt){
    if (!dctx) return;
    demoT += dt;
    const CYCLE = 3.0, FLIGHT = 0.8, CHARGE = 0.9, FADE = 0.15;
    let t = demoT % CYCLE;
    const W = 300, H = 120, baseY = 92, roofH = 20;
    const leftX0 = 20, leftX1 = 100, rightX0 = 200, rightX1 = 280;

    dctx.clearRect(0, 0, W, H);
    // độ mờ dần khi vòng lặp bắt đầu/kết thúc để che chỗ "dịch chuyển tức thời" về lại đầu
    let alpha = 1;
    if (t < FADE) alpha = t / FADE;
    else if (t > CYCLE - FADE) alpha = (CYCLE - t) / FADE;
    dctx.globalAlpha = alpha;

    // hai nóc nhà + khe
    dctx.fillStyle = '#1c2733';
    dctx.fillRect(leftX0, baseY, leftX1 - leftX0, H - baseY);
    dctx.fillRect(rightX0, baseY, rightX1 - rightX0, H - baseY);
    dctx.fillStyle = '#3d5468';
    dctx.fillRect(leftX0, baseY, leftX1 - leftX0, 5);
    dctx.fillRect(rightX0, baseY, rightX1 - rightX0, 5);
    dctx.fillStyle = 'rgba(255,103,103,.7)';
    dctx.fillRect(leftX1, baseY, rightX0 - leftX1, 2);

    let px, py, charging = false, chargeFrac = 0, squash = 0;
    if (t < CHARGE){
      px = leftX0 + 30; py = 0; charging = true; chargeFrac = t / CHARGE;
    } else if (t < CHARGE + FLIGHT){
      const s = (t - CHARGE) / FLIGHT;
      px = leftX0 + 30 + (rightX0 + 30 - (leftX0 + 30)) * s;
      py = Math.sin(Math.PI * s) * 46;
    } else if (t < CHARGE + FLIGHT + 0.15){
      px = rightX0 + 30; py = 0; squash = 1 - (t - CHARGE - FLIGHT) / 0.15;
    } else {
      px = rightX0 + 30; py = 0;
    }

    // vệt bay mờ để gợi ý quỹ đạo parabol
    if (t >= CHARGE && t < CHARGE + FLIGHT){
      dctx.fillStyle = 'rgba(63,169,245,.35)';
      for (let i = 0; i <= 10; i++){
        const s = i / 10; if (s > (t - CHARGE) / FLIGHT) break;
        const dx = leftX0 + 30 + (rightX0 + 30 - (leftX0 + 30)) * s;
        const dy = Math.sin(Math.PI * s) * 46;
        dctx.beginPath(); dctx.arc(dx, baseY - dy, 2, 0, Math.PI * 2); dctx.fill();
      }
    }

    // thanh sạc lực nhỏ phía trên nhân vật lúc giữ
    if (charging){
      dctx.fillStyle = 'rgba(255,255,255,.15)'; dctx.fillRect(px - 16, baseY - 44, 32, 6);
      dctx.fillStyle = '#3fa9f5'; dctx.fillRect(px - 16, baseY - 44, 32 * chargeFrac, 6);
    }

    // nhân vật đơn giản: hình bầu dục + một vệt kính nhỏ
    const ky = 1 - 0.3 * squash, kx = 1 + 0.22 * squash;
    dctx.fillStyle = '#3fa9f5'; dctx.strokeStyle = '#e7edf5'; dctx.lineWidth = 1.6;
    dctx.beginPath(); dctx.ellipse(px, baseY - py - 9 * ky, 11 * kx, 9 * ky, 0, 0, Math.PI * 2); dctx.fill(); dctx.stroke();
    dctx.strokeStyle = '#0a0e14'; dctx.lineWidth = 2.2; dctx.lineCap = 'round';
    dctx.beginPath(); dctx.moveTo(px - 5, baseY - py - 9 * ky); dctx.lineTo(px + 6, baseY - py - 10 * ky); dctx.stroke();

    dctx.globalAlpha = 1;
  }

  /* ---------- Vòng lặp ---------- */
  const DT = 1 / 120;
  function frame(ts){
    const dt = Math.min(0.05, (ts - lastTime) / 1000 || 0);
    lastTime = ts;
    acc += dt;
    while (acc >= DT){ step(DT); acc -= DT; }

    if (state === 'dead'){
      deadT += dt;
      if (deadT > 0.6 && btnAgain.hidden) showDead();
    }
    camX += (P.x - viewW * 0.28 - camX) * Math.min(1, dt * 6);
    const ty = lastRoof + 0.5 * (P.y - lastRoof);
    camY += (ty - camY) * Math.min(1, dt * 4);
    genAhead(camX + viewW);
    while (buildings.length > 4 && buildings[1].x1 < camX - 25) buildings.shift();

    render();
    if (state === 'ready') drawDemo(dt);
    requestAnimationFrame(frame);
  }

  resize();
  reset();
  requestAnimationFrame(frame);
})();
</script>
